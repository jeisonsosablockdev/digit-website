# DIGIT keeps .codex configuration domain-aligned with the repository.
# MCP entries here must stay repo-relevant and avoid checked-in secrets.

[mcp_servers.stitch]
url = "https://stitch.googleapis.com/mcp"
required = false

[mcp_servers.stitch.env_http_headers]
"X-Goog-Api-Key" = "STITCH_API_KEY"
